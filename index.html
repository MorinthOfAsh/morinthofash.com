<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morinthofash Minecraft Server</title>

    <!-- Importing a Google Font that looks like Minecraft text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #f0f0f0;
            --accent-green: #55ff55;
            --accent-glow: #55ff5566;
            --border-color: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Subtle pattern background */
            background-image: radial-gradient(circle at 50% 50%, #1f1f1f 0%, #121212 100%);
        }

        .container {
            background-color: var(--card-bg);
            padding: 3rem;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        /* Decorative top bar */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }

        h1 {
            font-family: 'Press Start 2P', cursive; /* Minecraft font style */
            font-size: 2rem;
            line-height: 1.5;
            margin-bottom: 1rem;
            color: #fff;
            text-shadow: 4px 4px 0px #000;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .server-ip-box {
            background-color: #000;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }

        .ip-text {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.2rem;
            color: var(--accent-green);
            letter-spacing: 1px;
        }

        .copy-btn {
            background-color: transparent;
            border: 2px solid var(--accent-green);
            color: var(--accent-green);
            padding: 8px 16px;
            font-family: 'Roboto', sans-serif;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background-color: var(--accent-green);
            color: #000;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 2rem;
        }

        .tag {
            background: #2a2a2a;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            border: 1px solid #333;
        }

        footer {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #555;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>MORINTHOFASH</h1>
        <p class="subtitle">Survival & Adventure Awaits. Join us today!</p>

        <div class="server-ip-box">
            <span class="ip-text" id="ipAddress">play.morinthofash.com</span>
            <button class="copy-btn" onclick="copyIP()">Copy</button>
        </div>

        <div class="features">
            <div class="tag">⚔️ PvP</div>
            <div class="tag">🛠️ Building</div>
            <div class="tag">🌲 Survival</div>
        </div>

        <footer>
            &copy; 2023 Morinthofash Network. Not affiliated with Mojang AB.
        </footer>
    </div>

    <script>
        function copyIP() {
            const ipText = document.getElementById("ipAddress");
            const btn = document.querySelector(".copy-btn");

            // Copy text to clipboard
            navigator.clipboard.writeText(ipText.innerText).then(() => {
                // Visual feedback
                const originalText = btn.innerText;
                btn.innerText = "Copied!";
                btn.style.backgroundColor = "var(--accent-green)";
                btn.style.color = "#000";

                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = "transparent";
                    btn.style.color = "var(--accent-green)";
                }, 2000);
            });
        }
    </script>

</body>
</html>
